[window]
padding = { x = 5, y = 5 }
dynamic_padding = true
decorations = "Full"
# startup_mode = "Maximized"
dimensions = { columns = 150, lines = 40 }

[scrolling]
history = 100000
multiplier = 5

[font]
normal = { family = "Fira Code", style = "Regular" }
size = 16
offset = { x = 0, y = 0 }

[terminal]
shell = { program = "/usr/bin/fish" }

[env]
TERM = "xterm-256color"
